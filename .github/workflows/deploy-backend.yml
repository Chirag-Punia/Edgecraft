name: Deploy Backend to Lambda

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
  workflow_dispatch:  # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: SAM Build
        working-directory: server
        run: sam build

      - name: SAM Deploy
        working-directory: server
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              DatabaseUrl="${{ secrets.DATABASE_URL }}" \
              SecretKey="${{ secrets.SECRET_KEY }}" \
              FrontendUrl="${{ secrets.FRONTEND_URL }}" \
              SmtpHost="${{ secrets.SMTP_HOST }}" \
              SmtpPort="${{ secrets.SMTP_PORT }}" \
              SmtpUser="${{ secrets.SMTP_USER }}" \
              SmtpPassword="${{ secrets.SMTP_PASSWORD }}" \
              FromEmail="${{ secrets.FROM_EMAIL }}"
